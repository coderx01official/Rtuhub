:"Parivartan ECSS Programme 2026-27 [Win scholarship up to INR 75,000]","url":"page/hdfc-bank-parivartans-ecss-programme","keyword":"Scholarship 2026, School Scholarship, Undergraduate Scholarship,  Parivartan ECSS Programme for Postgraduate Courses , College Scholarship, PG Scholarship, Diploma","description":"Parivartan ECSS Programme 2026-27 aims to support school students from Classes 1 to 12 and those pursuing diploma, ITI, polytechnic, UG, and PG (general and professional) programmes by providing financial assistance.","flgDeleted":0,"canonicalUrl":"page/hdfc-bank-parivartans-ecss-programme"},"__N_SSP":true,"pageProps":{"scholarship":{"source":"brand-page","oppurtunityType":"Scholarship","qnaCategory":null,"brandPage":{"aboutUs":null,"logoUrl":"https://d2w7l1p59qkl0r.cloudfront.net/static/scholarship_logo/document_1759915764.jpg","brandPageId":4948,"address":null,"email":"ecss@buddy4study.com","slug":"hdfc-bank-parivartans-ecss-programme","name":"HDFC Bank","aboutProgram":"\u003cp\u003e\u003cstrong\u003eParivartan Educational Crisis Scholarship Support (ECSS) Programme 2026-27\u003c/strong\u003e is a scholarship initiative by \u003cstrong\u003eHDFC Bank\u003c/strong\u003e through its CSR programme, \u003cstrong\u003eParivartan\u003c/strong\u003e. The programme is built on a simple but powerful conviction: a student\u0026#39;s financial circumstances or personal hardships should never be the reason they discontinue school or college. The opportunity is \u003cstrong\u003eopen to school students from Classes 1 to 12, as well as those pursuing diploma, ITI, polytechnic, UG, and PG (both general and professional) courses\u003c/strong\u003e. The programme aims to provide financial assistance of \u003cstrong\u003eup to INR 75,000\u003c/strong\u003e to meritorious students with limited financial means. Preference will be given to those who have faced a personal or family crisis that may affect their ability to continue their education.\u003c/p\u003e\r\n\r\n\u003cp\u003eParivartan has been a catalyst for community-level transformation through focused interventions in rural development, education, skill development, livelihood enhancement, healthcare, hygiene promotion, and financial literacy. Through the ECSS initiative, this commitment reaches students directly, helping ensure that personal or family crises do not disrupt their academic journey.\u003c/p\u003e","headline":null,"bannerImageUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarships/banners/document_1785928536.webp","redirectLink":null,"programName":"Parivartan ECSS Programme 2026-27","mobile":43092248,"phone":"011-430-92248 (Ext: 116)","qnaCategoryId":4917,"qnaCategorySlug":"hdfc-bank-parivartan-s-ecs-scholarship","tnc":null,"updatedAt":1791547617000,"videos":[],"audios":[],"scholarships":[{"scholarshipId":26636,"deadline":"2026-10-31","title":"Parivartan ECSS Programme for School Students (Merit-cum-Need Based) 2026-27","logoUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarship_logo/logo_26636_1780645881.jpg","bsid":"HDFC63","slug":"parivartan-ecss-programme-for-school-students-merit-cum-need-based-2026-27","eligibility":"\u003cul\u003e\r\n\t\u003cli\u003eThe applicant must be currently enrolled in \u003cstrong\u003eClasses 1 to 12, or pursuing a diploma, ITI, or polytechnic course\u003c/strong\u003e at a private, government, or government-aided institution in India.\u003c/li\u003e\r\n\t\u003cli\u003eA minimum of \u003cstrong\u003e55% marks\u003c/strong\u003e in the most recent qualifying examination is required.\u003c/li\u003e\r\n\t\u003cli\u003eThe annual family income from all sources must not exceed \u003cstrong\u003eINR 2.5 lakh\u003c/strong\u003e.\u003c/li\u003e\r\n\t\u003cli\u003eOpen to Indian nationals only.\u003c/li\u003e\r\n\t\u003cli\u003ePreference will be given to applicants who have experienced a personal or family crisis in the past three years that has significantly impaired their ability to bear the cost of education and placed them a
