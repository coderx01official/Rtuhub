  <div id="XF-header"></div>
  <div id="404Component" class="pageWrapper">

  <div id="XF-footer"></div>

  <!-- Your own JavaScript -->
  <script>
    const parser = new DOMParser();
    const domainUrl = window.location.origin;


    // API call helper
    function apiCall(method, url) {
      return new Promise(function (resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
          if (this.readyState === 4) {
            if (this.status === 200) {
              resolve(this.responseText);
            } else {
              reject(this.responseText);
            }
          }
        };
        xhr.open(method, url);
        xhr.send();
      });
    }
    function D() {
      // Remove 'show' from all overlays
      const overlays = document.querySelectorAll('.overLay');
      overlays.forEach(function(overlay) {
        overlay.classList.remove('show');
      });

      // Remove 'show' from header-mobile overlay
      const headerMobileOverlay = document.querySelector('.header-mobile .overLay');
      if (headerMobileOverlay) {
        headerMobileOverlay.classList.remove('show');
      }

      // Remove 'show' from all .jsopenDropdown.show
      const openDropdowns = document.querySelectorAll('.jsopenDropdown.show');
      openDropdowns.forEach(function(dropdown) {
        dropdown.classList.remove('show');
      });

      // Remove 'active' from all .jsOpenmenu.active and their dropdowns if click is outside
      const openMenus = document.querySelectorAll('.jsOpenmenu.active');
      document.addEventListener('click', function(event) {
        openMenus.forEach(function(menu) {
          const mainTab = menu.closest('.mainTabKey');
          if (mainTab && !mainTab.contains(event.target)) {
            menu.classList.remove('active');
            const dropdown = mainTab.querySelector('.jsopenDropdown');
            if (dropdown) dropdown.classList.remove('show');
          }
        });
      });

      // Remove 'active' from all .selectLink and hide their openlinkList
      const selectLinks = document.querySelectorAll('.selectLink');
      const desktopHeaderOverlay = document.querySelector('.desktop-header .overLay');
      selectLinks.forEach(function(link) {
        if (link.classList.contains('active')) {
          if (desktopHeaderOverlay) desktopHeaderOverlay.classList.remove('show');
          link.classList.remove('active');
          const navList = link.closest('.nav-list');
          if (navList) {
            const openLinkList = navList.querySelector('.openlinkList');
            if (openLinkList) openLinkList.classList.remove('show');
          }
        }
      });

      // Remove 'show' from all .langList.active
      const langLists = document.querySelectorAll('.langList');
      langLists.forEach(function(lang) {
        if (lang.classList.contains('active')) {
          if (desktopHeaderOverlay) desktopHeaderOverlay.classList.remove('show');
          lang.classList.remove('show');
        }
      });

      // Remove 'show' from all .langList.show
      langLists.forEach(function(lang) {
        if (lang.classList.contains('show')) {
          lang.classList.remove('show');
        }
      });
    }


                

      document.addEventListener("click", function(e) {
        if (e?.target?.classList?.contains("active2")) {
          const navLevel4Els = document.querySelectorAll(".navLevel4");
          const active2Els = document.querySelectorAll(".active2");
          navLevel4Els?.forEach(function(el) {
            el?.classList?.remove("show");
            document.body?.classList?.remove("noScroll");
          });
          active2Els?.forEach(function(el) {
            el?.classList?.remove("active", "active2");
          });
        }
      });


    // Experience Fragment paths
    const headerPath = "/content/experience-fragments/hdfcbankpws/in/en/site/header/master.html";
    const footerPath = "/content/experience-fragments/hdfcbankpws/in/en/site/footer/master.html";
    const page404Path = "/content/experience-fragments/hdfcbankpws/in/en/site/page-404/master.html";

    // API calls for header, footer, and 404
    const headerAPI = apiCall("GET", `${domainUrl}${headerPath}`);
    const footerAPI = apiCall("GET", `${domainUrl}${footerPath}`);
    const page404API = apiCall("GET", `${domainUrl}${page404Path}`);

    Promise.all([headerAPI, footerAPI, page404API])
      .then(([headerResponse, footerResponse, page404Response]) => {
        // === HEADER ===
        const docHeader = parser.parseFromString(headerResponse, "text/html");
        const header = docHeader.querySelector(".header") || docHeader.body.firstElementChild;
        if (header) document.getElementById("XF-header").appendChild(header);

        // === FOOTER ===
        const docFooter = parser.parseFromString(footerResponse, "text/html");
        const footer = docFooter.querySelector(".footer") || docFooter.body.firstElementChild;
        if (footer) document.getElementById("XF-footer").appendChild(footer);

        // === 404 SECTION ===
        const doc404 = parser.parseFromString(page404Response, "text/html");
        const page404Sec = doc404.querySelector(".page-404-sec");
        const lookingForSec = doc404.querySelector(".looking-for-sec");
        if (page404Sec) document.getElementById("404Component").appendChild(page404Sec);
        if (lookingForSec) document.getElementById("404Component").appendChild(lookingForSec);

        // Dynamically get CSS/JS URLs from header fragment
        const cssLinks = Array.from(docHeader.querySelectorAll('link[rel="stylesheet"]')).map(link => link.getAttribute('href')).filter(Boolean);
        const jsLinks = Array.from(docHeader.querySelectorAll('script[src]')).map(script => script.getAttribute('src')).filter(Boolean);
        let cssLoaded = 0;
        let jsLoaded = 0;
        const totalCSS = cssLinks.length;
        const totalJS = jsLinks.length;

        function checkLoaded() {
          if (cssLoaded === totalCSS && jsLoaded === totalJS) {
            document.body.style.display = "block";
          }
        }

        // Load CSS dynamically
        cssLinks.forEach(href => {
          if (href && !href.startsWith('http')) href = domainUrl + href;
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          link.onload = () => { cssLoaded++; checkLoaded(); };
          link.onerror = () => { cssLoaded++; checkLoaded(); };
          document.head.appendChild(link);
        });

        // Load JS dynamically
        jsLinks.forEach(src => {
          if (src && !src.startsWith('http')) src = domainUrl + src;
          const script = document.createElement('script');
          script.src = src;
          script.defer = true;
          script.onload = () => { jsLoaded++; checkLoaded(); };
          script.onerror = () => { jsLoaded++; checkLoaded(); };
          document.body.appendChild(script);
        });
       
        const overLay = document.querySelectorAll(".overLay");
        if(overLay){
          overLay.forEach((function(e, t) {
                e.addEventListener("click", (function() {
                    D()
                }
                ))
            }
            ))
        }

      })

      .catch((err) => {
        //console.error("Error during API calls:", err);
        document.body.style.display = "block"; // Show body even if error, to avoid blank page
      });

      // Dynamically load Adobe DTM script after page load
      (function() {
        try {
          var script = document.createElement('script');
          script.src = 'https://assets.adobedtm.com/80673311e435/fa363ab0f5b6/launch-cd9f24fc8ea6.min.js';
          script.async = true;
          document.body.appendChild(script);
        } catch (err) {
          //console.error('Adobe DTM loader error:', err);
        }
      })();



    window.adobeDataLayer = window.adobeDataLayer || [];
