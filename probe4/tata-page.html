:"Mission","mission_desc":"To simplify scholarship accessibility for students and disbursement process for providers","values":"Values","values_desc":"Honesty | Integrity | Transparency","company_history":"Company History","company_march_2019_award":"Recognized for 'Creating Social Impact through Access to Education'- World CSR Congress: CSR Leadership Awards 2019","company_february_2019_award":"Best CSR Impact Award 2019- UBS Forums Corporate Social Responsibility Awards","company_june_2017_award":"Innovators Race Top 50 2017 finalists","company_march_1_2017_award":"Winner of Best CSR Project Award by IndiaCSR","company_march_2_2017_award":"Awards of Appreciation by IndiaCSR presented in National Summit on Best Practices in CSR","company_march_2016_award":"Incubated at IIM Calcutta through a rigorous selection out of 900 applicants","company_october_1_2015_award":"Chosen among top 50 Most Innovative IT Product Companies of 2015 as per NASSCOM Emerge 50 wards","company_october_2_2015_award":"Recognized by Indian Institute of Management, Rohtak at 2nd Internet Start-up Summit – October","company_february_2015_award":"Top 10 Social Enterprise of 2015 among India’s 100 leading Social Entrepreneurs as per Action for India Forum","company_december_2014_award":"Winner of South Asia \u0026 Asia Pacific Manthan Award in education category among 69 teams from 39 countries","company_february":"February","company_march":"March","company_june":"June","company_october":"October","company_december":"December","about_us_banner_title":"india's largest scholarship platform","about_us_banner_desc":"Connecting Scholarship Seekers with Scholarship Providers","about_us_breadcrum":"About Us","disclaimer_title":"Disclaimer","privacy_policy_title":"गोपनीयता नीति","update_mobile_section_title":"Update Mobile No.","my_favorites_title":"My Favorites","footer_menu_faqs":"FAQS","footer_menu_tnc":null},"url":"/page/the-tata-capital-pankh-scholarship-programme","seoData":{"id":46524,"title":"Tata Capital Pankh Scholarship Program 2026-27 [Receive scholarship up to INR 18,000]","url":"page/the-tata-capital-pankh-scholarship-programme","keyword":"Scholarship 2026, Tata Capital Pankh Scholarship Program, School scholarship, general graduation scholarships, polytechnic scholarships, diploma scholarships, Professional Graduation","description":"The Tata Capital Pankh Scholarship Program 2026-27 is an initiative of Tata Capital Limited to support the higher education of students belonging to economically weaker sections of society.","flgDeleted":0,"canonicalUrl":"page/the-tata-capital-pankh-scholarship-programme"},"__N_SSP":true,"pageProps":{"scholarship":{"source":"brand-page","oppurtunityType":"Scholarship","qnaCategory":null,"brandPage":{"aboutUs":null,"logoUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarship_logo/document_1787638020.jpg","brandPageId":4945,"address":null,"slug":"the-tata-capital-pankh-scholarship-programme","name":"Tata Capital Limited","aboutProgram":"\u003cp\u003eThe \u003cstrong\u003eTata Capital Pankh Scholarship Program 2026-27\u003c/strong\u003e, an initiative by \u003cstrong\u003eTata Capital Limited\u003c/strong\u003e, aims to support the higher education of meritorious students from economically weaker sections of society. The name \u003cstrong\u003e\u0026#39;Pankh\u0026#39;\u003c/strong\u003e, which means \u003cstrong\u003e\u0026#39;wings\u0026#39;\u003c/strong\u003e in Hindi, symbolises the program\u0026#39;s belief that financial constraints should never limit the aspirations of talented young minds.\u003c/p\u003e\r\n\r\n\u003cp\u003eUnder this program, students currently studying in \u003cstrong\u003eClasses 11 or 12, as well as those pursuing undergraduate degrees, diplomas, or ITI courses\u003c/strong\u003e at recognised institutions across India, are eligible for financial assistance.\u003c/p\u003e\r\n\r\n\u003cp\u003eLaunched as part of \u003cstrong\u003eTata Capital Limited\u0026#39;s Corporate Social Responsibility (CSR)\u003c/strong\u003e initiative, the scholarship seeks to eliminate financial barriers that hinder deserving students from pursuing their educational goals. By empowering students with access to quality education, the program contributes to nurturing a more educated, skilled, and self-reliant generation.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAbout Tata Capital Limited\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eTata Capital Limited, a leading financial services company within the Tata Group, has introduced this scholarship program as a part of its Corporate Social Responsibility (CSR) efforts. It aims to positively impact society by providing educational support to deserving and underprivileged students. Alongside this scholarship, Tata Capital actively engages in various CSR initiatives focused on Education, Skill Development, Environment, and Health, striving to make a meaningful difference in these areas.\u003c/p\u003e","headline":null,"bannerImageUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarships/banners/document_1787729530.png","redirectLink":null,"programName":"Tata Capital Pankh Scholarship Program 2026-27","qnaCategoryId":4444,"qnaCategorySlug":"tata-pankh-scholarship-program","tnc":null,"updatedAt":1788253647000,"videos":[],"audios":[],"scholarships":[{"scholarshipId":26602,"deadline":"2026-10-26","title":"Tata Capital Pankh Scholarship for Class 11th and 12th Students (2026-27)","logoUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarship_logo/logo_26602_1780296490.jpg","bsid":"TCPS37","slug":"tata-capital-pankh-scholarship-for-class-11th-and-12th-students","eligibility":"\u003cul\u003e\r\n\t\u003cli\u003eOpen to \u003cstrong\u003eIndian students\u003c/strong\u003e currently enrolled in \u003cstrong\u003eClasses 11 or 12\u003c/strong\u003e at a recognised educational institution in \u003cstrong\u003eIndia\u003c/strong\u003e.\u003c/li\u003e\r\n\t\u003cli\u003eApplicants must have secured at least \u003cstrong\u0
