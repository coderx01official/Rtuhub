 family income\u003cstrong\u003e*\u003c/strong\u003e of no more than ₹3,00,000 from all sources\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e*Note:-\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn addition to gross family income, the education and occupation of parents and other family members, including elder siblings, will be considered when determining an applicant\u0026#39;s financial eligibility. The family\u0026#39;s living conditions and total expenses incurred for the applicant\u0026#39;s education will also be taken into account.\u003c/li\u003e\r\n\t\u003cli\u003eApplicants who are the first in their family to graduate will be given preference over those who are second or third-generation of graduates.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eEmployees:-\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSalary/payslip from the employer is mandatory.\u003c/li\u003e\r\n\t\u003cli\u003eThe payslip must detail the employee\u0026#39;s basic salary, all allowances, and deductions.\u003c/li\u003e\r\n\t\u003cli\u003eBoth the employer and the employee must certify the salary/payslip.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003eAn income certificate from a local or other government authority cannot be accepted as a substitute for a salary/payslip.\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eRetirees or Pensioners:-\u0026nbsp;\u003c/strong\u003eA pension statement from the pension authority and/or an authorized bank is required, showing the family member\u0026#39;s gross monthly pension, including any supplementary allowances and before deductions.\u003c/li\u003e\r\n\t\u003cli\u003ePensioners must also provide documents indicating their official status or designation, gross salary at retirement, and the name of the employing organisation. If the parent/guardian recently retired under a voluntary retirement scheme, they must provide:\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eReasons for retirement:-\u0026nbsp;\u003c/strong\u003eThe amount of any lump-sum benefits received upon retirement\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eBusiness or Self-Employed:-\u003c/strong\u003e An income certificate issued by a government authority or a copy of the income tax return must be submitted to verify the gross family income declared in the application.\u003c/li\u003e\r\n\t\u003cli\u003eDetailed information about the nature and size of the business or self-employment is also required.\u003c/li\u003e\r\n\u003c/ul\u003e","howToApply":"\u003cp\u003e\u003cstrong\u003eEligible applicants can apply online for the scholarship by following the steps mentioned below:-\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStep 1\u003c/strong\u003e:Click on the \u003cstrong\u003e\u0026#39;Apply Now\u0026#39;\u003c/strong\u003e button and read the details carefully.\u003cbr /\u003e\r\n\u003cstrong\u003eStep 2\u003c/strong\u003e: Click on the\u003cstrong\u003e\u0026nbsp;\u0026#39;Register\u0026#39;\u003c/strong\u003e\u0026nbsp;button and fill in the required details to \u0026#39;\u003cstrong\u003eRegister\u003c/strong\u003e\u0026#39;. (\u003cstrong\u003eNote:\u003c/strong\u003e- If already registered, log in using Gmail/Mobile number/Email ID.)\u003cbr /\u003e\r\n\u003cstrong\u003eStep 3\u003c/strong\u003e: Navigate to the \u003cstrong\u003e\u0026#39;Apply Now\u0026#39; \u003c/strong\u003ebutton at the bottom of\u0026nbsp;the page and click on it.\u003cbr /\u003e\r\n\u003cstrong\u003eStep 4\u003c/strong\u003e: Fill in the required details in the preliminary application form, upload the necessary documents and submit.\u003c/p\u003e","introduction":"\u003cp\u003eFoundation for Excellence Scholarship for Technical Courses 2024-25 is an opportunity offered by the Foundation For Excellence (FFE), a publicly supported nonprofit organization. The program provides financial assistance to meritorious students from economically disadvantaged backgrounds who aspire to pursue undergraduate degrees in Engineering, Medicine,\u0026nbsp;or Law. The selected candidates will receive ₹50,000 per annum till course completion.\u003c/p\u003e","faq":null,"moreDetails":"\u003cul\u003e\r\n\t\u003cli\u003eApplications will be considered on a first-come first-served basis.\u003c/li\u003e\r\n\t\u003cli\u003eDiploma students are eligible for lateral entry into B.E. and B.Tech. degree\u0026nbsp;programs. B.Arch. and BDS students are not eligible.\u003c/li\u003e\r\n\u003c/ul\u003e","expertComments":null,"languageId":2,"scholarshipId":24722,"applicationDeclaration":"","benifit":"\u003cp\u003eThe selected candidates will receive\u0026nbsp;financial support for technology, engineering and medicine-related\u0026nbsp;courses.\u003c/p\u003e","importantDates":"\u003cp\u003e\u003cstrong\u003eApplication Deadline\u003c/strong\u003e - 31st December 2024\u003c/p\u003e","offeredBy":"\u003cp\u003eThe scholarship is being provided by the Foundation for Excellence (FFE).\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e","selectionCriteria":"\u003cp\u003eThe selection of scholars will be made by the Foundation for Excellence based on their academic performance and family income. The selection process consists of the following steps:\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSubmission of an online application form\u003c/li\u003e\r\n\t\u003cli\u003eOnline verification of the applicant\u0026#39;s academic credentials and family background\u003c/li\u003e\r\n\t\u003cli\u003eFinal selection based on the selection criteria\u003c/li\u003e\r\n\u003c/ul\u003e","required_document":"\u003cp\u003e\u003cstrong\u003eApplicants are required to upload the following primary documents once the application is ELIGIBLE:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eClass 12 marksheet\u003c/li\u003e\r\n\t\u003cli\u003eRank certificate\u003c/li\u003e\r\n\t\u003cli\u003eCounseling letter for seat allotment\u003c/li\u003e\r\n\t\u003cli\u003eFamily income certificate or Salary Slip (For 3 Months) or IT Return Form\u003c/li\u003e\r\n\t\u003cli\u003eTuition/Hostel/Mess fees paid receipts \u0026nbsp;\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eE-Aadhaar or scanned copy of original Aadhaar\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eApplicants are further required to upload the following secondary documents once the application is SELECTED:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBonafide certificate from college\u003c/li\u003e\r\n\t\u003cli\u003eStatement of estimated expenses from college\u003c/li\u003e\r\n\t\u003cli\u003eBank passbook copy for bank account details confirmation\u003c/li\u003e\r\n\t\u003cli\u003eParent declaration document\u003c/li\u003e\r\n\u003c/ul\u003e","instruction":""}],"scholarshipExtendedDates":[],"scholarshipFamilyIncomes":[{"id":17911,"familyIncomeAbsolute":0,"maxValue":null,"minValue":null,"scholarshipId":24722}],"scholarshipFeatureds":[{"id":24695,"featureWeight":null,"featured":0,"scholarshipId":24722}],"scholarshipMultilinguals":[{"id":13408,"applicableFor":"Students pursuing undergraduate courses","providerName":null,"purposeAward":"₹50,000 per annum till course completion","title":"Foundation for Excellence Scholarship for Technical Courses 2024-25","viewCounter":101,"scholarshipId":24722,"languageId":2,"providerType":null}],"scholarshipNewSymbols":[],"scholarshipOrphans":[],"scholarshipPhysicallyChallengeds":[],"scholarshipProviders":[{"id":12826,"providerAddress":"Foundation for Excellence\r\nNo. 840, 5th Main,\r\nIndiranagar 1st Stage,\r\nBengaluru 560 038, Karnataka, India","providerEmail":"scholarships@ffe.org","providerMobile":" (+91) (080) 2520 1925","providerName":"Foundation for Excellence","scholarshipId":24722,"providerType":161}],"scholarshipS
