Scholarships, PG Scholarships, UG Scholarships, Scholarships 2026, Life Sciences Scholarships, Science Scholarships","description":"Reliance Foundation Scholarships 2026-27 offers up to INR 600,000 to UG \u0026 PG students enabling them to become successful professionals.","flgDeleted":0,"canonicalUrl":"page/reliance-foundation-scholarships"},"__N_SSP":true,"pageProps":{"scholarship":{"source":"brand-page","oppurtunityType":"Outreach Project","qnaCategory":{"id":6584,"slug":"RFS3","status":1,"text":"reliance-foundation-scholarships","weight":1},"brandPage":{"aboutUs":null,"logoUrl":"https://d2w7l1p59qkl0r.cloudfront.net/static/scholarship_logo/document_1699529166.png","brandPageId":4980,"address":null,"email":"For PG Scholarship - RF.PGScholarships@reliancefoundation.org |  For UG Scholarship: RF.UGScholarships@reliancefoundation.org","slug":"reliance-foundation-scholarships","name":"Reliance Foundation","aboutProgram":"\u003cp\u003eEvery scholarship under this programme traces back to a single promise made in December 2022. On the 90th birth anniversary of Reliance\u0026#39;s Founder-Chairman, Shri Dhirubhai Ambani, Mrs Nita Ambani, Founder and Chairperson of Reliance Foundation, pledged 50,000 scholarships over ten years, a commitment rooted in the belief that a nation\u0026#39;s progress is inseparable from the opportunities it gives its youngest minds. That promise has already reached more than 33,000 students across India, and it continues to grow with every academic year.\u003c/p\u003e\r\n\r\n\u003cp\u003eSince 2022-2023, Reliance Foundation has been supporting 5,100 students annually, including 5,000 meritorious undergraduate students from underprivileged sections of society studying any stream of their choice through the Reliance Foundation Undergraduate Scholarships, and 100 of India\u0026#39;s brightest postgraduate students, studying eligible subjects in select future-ready courses from Engineering, Technology, Energy \u0026amp; Life Sciences through the Reliance Foundation Postgraduate Scholarships.\u003c/p\u003e\r\n\r\n\u003cp\u003eThe scholar\u0026rsquo;s journey doesn\u0026rsquo;t end with a scholarship disbursement. Both scholarships are designed with a longer-term vision-one where scholars stay connected well beyond graduation through an active and engaged alumni network that opens doors, fosters mentorship, and creates opportunities as these young professionals go on to shape India\u0026rsquo;s next phase of growth.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eReliance Foundation Undergraduate Scholarships\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Reliance Foundation Undergraduate Scholarships were created to identify and support talented young students with the potential to excel in their chosen fields. Through financial support and opportunities to be part of a wider scholar community, the programme enables students to pursue their aspirations, realise their potential and contribute meaningfully to their families, communities and the nation\u003c/p\u003e\r\n\r\n\u003cp\u003eStudents with a household income of less than INR 15 lakhs per year, who are enrolled in the first year of their undergraduate studies pursuing any subject/stream can apply. The programme also encourages applications from female and specially-abled students.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelected scholars will receive a scholarship of up to INR 2 lakhs over the duration of their degree programme. In addition to the scholarship grant, the Reliance Foundation Undergraduate Scholarships will provide scholars with an opportunity to be part of a vibrant alumni network and an enabling support system that will create a long-term impact on their lives and career trajectories.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eReliance Foundation Postgraduate Scholarships\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Reliance Foundation Postgraduate Scholarships recognise exceptional young talent pursuing advanced study in future-ready disciplines. Designed for students with strong academic performance and the potential to become researchers, innovators and leaders, the programme aims to nurture expertise that can contribute to India\u0026#39;s evolving needs and opportunities.\u003c/p\u003e\r\n\r\n\u003cp\u003eThrough a competitive, merit-based selection process, 100 outstanding postgraduate students are selected each year across Engineering, Technology, Energy and Life Sciences.\u003c/p\u003e\r\n\r\n\u003cp\u003eThe support extends well beyond the scholarship grant. Scholars gain access to a comprehensive development track, expert interactions, industry exposure, and opportunities to volunteer, joining a growing community of innovative thinkers working toward the social good each year.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAbout Reliance Foundation\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eReliance Foundation, the philanthropic arm of Reliance Industries Limited, aims to play a catalytic role in addressing India\u0026rsquo;s development challenges through innovative and sustainable solutions. Led by Smt. Nita M Ambani, Founder and Chairperson, Reliance Foundation is relentlessly working for the overall well-being and enhanced quality of life for all, focusing on rural transformation, education, health, sports for development, disaster management, women empowerment, urban renewal and arts, culture and heritage, and has touched the lives of over 100 million people across India, in over 98,000 villages and urban locations.\u003c/p\u003e\r\n\r\n\u003cp\u003eMore on www.reliancefoundation.org\u003c/p\u003e\r\n\r\n\u003cp\u003eFollow Reliance Foundation on:\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eX: Reliance Foundation (\u003ca href=\"https://x.com/ril_foundation\" target=\"_blank\"\u003e@ril_foundation\u003c/a\u003e) on X\u003c/li\u003e\r\n\t\u003cli\u003eFacebook: \u003ca href=\"https://www.facebook.com/foundationRIL\" target=\"_blank\"\u003ehttps://www.facebook.com/foundationRIL\u003c/a\u003e\u003c/li\u003e\r\n\t\u003cli\u003eLinkedIn: \u003ca href=\"https://in.linkedin.com/company/reliancefoundation\" target=\"_blank\"\u003eReliance Foundation | LinkedIn\u003c/a\u003e\u003c/li\u003e\r\n\t\u003cli\u003eInstagram: \u003ca href=\"https://www.instagram.com/reliancefoundation/\" target=\"_blank\"\u003ehttps://www.instagram.com/reliancefoundation/\u003c/a\u003e\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eYouTube: \u003ca href=\"https://www.youtube.com/@RelianceFoundationTV?reload=9\" target=\"_blank\"\u003ehttps://www.youtube.com/@RelianceFoundationTV\u003c/a\u003e\u003c/li\u003e\r\n\u003c/ul\u003e","headline":null,"bannerImageUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarships/banners/document_1786696175.jpg","redirectLink":null,"programName":"Reliance Foundation Scholarships 2026-27","mobile":0,"qnaCategoryId":6584,"qnaCategorySlug":"reliance-foundation-scholarships","tnc":null,"updatedAt":1786700687000,"videos":[],"audios":[],"scholarships":[{"scholarshipId":26869,"deadline":"2026-10-05","title":"Reliance Foundation Undergraduate Scholarships 2026-27","logoUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarship_logo/logo_26869_1786019745.png","bsid":"RFS14","slug":"reliance-foundation-undergraduate-scholarships-2026-27","eligibility":"\u003cp\u003eAn applicant must:\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBe a resident Indian citizen.\u003c/li\u003e\r\n\t\u003cli\u003eHave a minimum of 60% marks in Class 12 board exams.\u003c/li\u003e\r\n\t\u003cli\u003eCurrently be enrolled in the 1st year (academic year 2026-27) of a regular, full-time degree course, in any stream\u003c/li\u003e\r\n\t\u003cli\u003eBelong to a household with an income of less than Rs. 15 Lakhs\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eComplete the mandatory Aptitude Test\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003eThe following students are not eligible:\u003c/p\u003e\r\n\r\n\u003c tered ID to land on the \u0026#39;Online Application Form Page.\u0026#39; If not registered, applicants may register on Buddy4Study using their Email, Mobile number, or Google account\u003c/li\u003e\r\n\t\u003cli\u003eApplicants will then be redirected to the official \u0026#39;Reliance Foundation Scholarships 2026-27\u0026#39; page.\r\n\t\u003cul\u003e\r\n\t\t\u003cli\u003ePlease note that your application form has to be submitted on the Reliance Foundation official page.\u003c/li\u003e\r\n\t\u003c/ul\u003e\r\n\t\u003c/li\u003e\r\n\t\u003cli\u003eKindly select the aptitude test date and submit your application. (Aptitude test is mandatory to be considered for the scholarship)\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u003cem\u003eImportant Note:\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cem\u003eAll applicants are required to complete an online aptitude test as part of their application\u003c/em\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u003cem\u003eOnce the application is submitted, applicants will receive a confirmation email that will include the date and time of the online exam\u003c/em\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u003cem\u003eApplicants can find the unique link for the final exam on the application portal, one day before the exam. Applicants can also take a practice test one week before the final test\u003c/em\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u003cem\u003eApplications will be considered complete only when the aptitude test has been completed. Scores will be sent directly to Reliance Foundation once the test is submitted; applicants will not be notified of their scores\u003c/em\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u003cem\u003eReliance Foundation does not charge any application fees to apply for this scholarship programme\u003c/em\u003e\u003c/li\u003e\r\n\u003c/ul\u003e","offeredBy":"\u003cp\u003eN/A\u003c/p\u003e","oppurtunityType":"Outreach Project","pag
