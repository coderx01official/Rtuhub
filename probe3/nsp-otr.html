      <div class="modal-content">

        <div class="modal-body py-4 px-2">

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="searchbox">
            <div class="dropdown filter-wrap">
              <a class="filter-btn" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="assets/images/icons/filter.svg">
              </a>

              <ul class="dropdown-menu">



                <li>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">
                      Default checkbox
                    </label>
                  </div>
                </li>
                <li>

                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value id="flexCheckChecked">
                    <label class="form-check-label" for="flexCheckChecked">
                      NSP registered Institutes
                    </label>
                  </div>
                </li>
              </ul>
            </div>



            <input type="text" class="form-control" placeholder="Search by Keywords...">
            <button type="submit" class="btn serch-btn"><img src="assets/images/icons/serch-color.svg"></button>

  </div>


  <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/script/3.2.1/jquery.min.js"></script>
  <script type="text/javascript" src="assets/owlcarousel/js/owl.carousel.js"></script>
  <script src="assets/script/CustomScripts.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
	// alert("hi")
	const inputs = document.querySelectorAll('.otp-fild');

	inputs.forEach((input, index) => {
		input.addEventListener('input', () => {
			if (input.value.length > 0 && index < inputs.length - 1) {
				inputs[index + 1].focus();
			}
		});

		input.addEventListener('keydown', (e) => {
			if (e.key === 'Backspace' && index > 0 && input.value === '') {
				inputs[index - 1].focus();
			}
		});

		input.addEventListener('paste', (e) => {
			e.preventDefault();
			const pasteData = (e.clipboardData || window.clipboardData).getData('text');
			const pasteArray = pasteData.split('');

			pasteArray.forEach((char, i) => {
				if (i < inputs.length) {
					inputs[i].value = char;
				}
			});
			inputs[pasteArray.length < inputs.length ? pasteArray.length : inputs.length - 1].focus();
		});
	});
});
  </script>
