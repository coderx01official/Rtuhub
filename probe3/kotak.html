sparency","company_history":"Company History","company_march_2019_award":"Recognized for 'Creating Social Impact through Access to Education'- World CSR Congress: CSR Leadership Awards 2019","company_february_2019_award":"Best CSR Impact Award 2019- UBS Forums Corporate Social Responsibility Awards","company_june_2017_award":"Innovators Race Top 50 2017 finalists","company_march_1_2017_award":"Winner of Best CSR Project Award by IndiaCSR","company_march_2_2017_award":"Awards of Appreciation by IndiaCSR presented in National Summit on Best Practices in CSR","company_march_2016_award":"Incubated at IIM Calcutta through a rigorous selection out of 900 applicants","company_october_1_2015_award":"Chosen among top 50 Most Innovative IT Product Companies of 2015 as per NASSCOM Emerge 50 wards","company_october_2_2015_award":"Recognized by Indian Institute of Management, Rohtak at 2nd Internet Start-up Summit – October","company_february_2015_award":"Top 10 Social Enterprise of 2015 among India’s 100 leading Social Entrepreneurs as per Action for India Forum","company_december_2014_award":"Winner of South Asia \u0026 Asia Pacific Manthan Award in education category among 69 teams from 39 countries","company_february":"February","company_march":"March","company_june":"June","company_october":"October","company_december":"December","about_us_banner_title":"india's largest scholarship platform","about_us_banner_desc":"Connecting Scholarship Seekers with Scholarship Providers","about_us_breadcrum":"About Us","disclaimer_title":"Disclaimer","privacy_policy_title":"गोपनीयता नीति","update_mobile_section_title":"Update Mobile No.","my_favorites_title":"My Favorites","footer_menu_faqs":"FAQS","footer_menu_tnc":null},"url":"/page/kotak-kanya-scholarship","seoData":{"id":64509,"title":"Kotak Kanya Scholarship 2026-27 [Win up to INR 1.5 lakh per year]","url":"page/kotak-kanya-scholarship","keyword":"Scholarship 2026, Kotak Kanya Scholarship, Girls Scholarship, Scholarship for Girls, Undergraduate Scholarship, National Scholarship","description":"Kotak Kanya Scholarship 2026-27 offers up to INR 1.5 lakh per year to meritorious girl students who have secured admission to the first year of graduation programs.","flgDeleted":0,"canonicalUrl":"page/kotak-kanya-scholarship"},"__N_SSP":true,"pageProps":{"scholarship":{"source":"brand-page","oppurtunityType":"Scholarship","qnaCategory":null,"brandPage":{"aboutUs":null,"logoUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarship_logo/document_1784108776.png","brandPageId":4961,"address":null,"slug":"kotak-kanya-scholarship","name":"Kotak Kanya Scholarship 2026","aboutProgram":"\u003cp\u003eThe \u003cstrong\u003eKotak Kanya Scholarship\u0026nbsp;2026-27\u0026nbsp;\u003c/strong\u003eis a collaborative CSR initiative by the Kotak Mahindra Group, implemented in partnership with the \u003cstrong\u003eKotak Education Foundation. \u003c/strong\u003eThis scholarship is designed to provide financial assistance to deserving girl students from underprivileged backgrounds, enabling them to pursue higher education in professional fields after completing Class 12.\u003c/p\u003e\r\n\r\n\u003cp\u003eFor the 2026 Kotak Kanya Scholarship, eligible girl students who have passed Class 12 and wish to enrol in reputable professional graduation courses (Engineering, MBBS, Architecture, Design, integrated LLB, and others) are invited to apply. Selected students will receive a scholarship of ₹1.5 lakh* per year to help cover their academic expenses until they complete their degree.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003eDisclaimer:\u003c/strong\u003e Terms and Conditions Apply. Scholarship selection and amount is based on fulfilment of the eligibility criteria and will be at the discretion of Kotak Education Foundation.\u003c/em\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAbout Kotak Mahindra Group\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eEstablished in 1985, Kotak Mahindra Group is one of India\u0026#39;s leading financial services conglomerates. In February 2003, Kotak Mahindra Finance Ltd. (KMFL), the Group\u0026#39;s flagship company, received a banking license from the Reserve Bank of India (RBI), becoming the first non-banking finance company in India to convert into a bank - Kotak Mahindra Bank Ltd (KMBL).\u003cbr /\u003e\r\nKotak Mahindra Group (Group) offers a wide range of financial services that encompass every sphere of life. From commercial banking to stock broking, mutual funds, life and general insurance and investment banking, the Group caters to the diverse financial needs of individuals and the corporate sector. The premise of Kotak Mahindra Group\u0026rsquo;s business model is concentrated in India, with diversified financial services. The bold vision that underscores the Group\u0026rsquo;s growth is an inclusive one, with a host of products and services designed to address the needs of the unbanked and insufficiently banked.\u003c/p\u003e\r\n\r\n\u003cp\u003eKotak Mahindra Group has a global presence through its subsidiaries in the UK, USA, the Gulf Region, Singapore and Mauritius, with offices in London, New York, Dubai, Abu Dhabi, Singapore and Mauritius respectively. As on 31st March, 2026, Kotak Mahindra Bank Ltd has a national footprint of 1,948 branches and 3,291 ATMs (incl. cash recyclers), and branches in GIFT City and DIFC (Dubai).\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cem\u003eFor more information, please visit the Company\u0026rsquo;s website at www.kotak.com\u003c/em\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAbout Kotak Education Foundation\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eIt has been a rewarding seventeen years since we embarked on our mission to equip economically disadvantaged children and youth with education and foundational skills, galvanising them towards a better future. Our \u0026lsquo;Inch Wide Mile Deep\u0026rsquo; approach, home-grown projects focused on quality education for the low-income segment, have been instrumental in shaping the success of our projects across India. KEF\u0026rsquo;s approach is primarily three-pronged \u0026ndash;\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eholistic interventions with children and educators in school,\u003c/li\u003e\r\n\t\u003cli\u003eequitable scholarships for higher studies, and\u003c/li\u003e\r\n\t\u003cli\u003evocational education and skills training for livelihood.\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cp\u003eStrengthening school leadership and teacher capacity building, creating a digital ecosystem and learning environment in schools, equipping middle school students with confidence and skills of Communicative English Future Readiness, upskilling teachers to provide Foundational Literacy \u0026amp; Numeracy skills, and supporting districts in building and running Model Schools \u0026ndash; these are key interventions run by KEF in Maharashtra and partially in Gujarat. KEF launched the Kotak Kanya Scholarship in 2021 to offer financial and academic support to meritorious girl students for the pursuit of higher education from all over India. Kotak Junior Scholarship supports meritorious students from the Mumbai Metropolitan Region for pursuing the 11th and 12th standards. KEF\u0026rsquo;s Unnati project upskills unemployed youth from economically weaker sections of society and coaches them in the basics of IT and spoken English, life skills and personality development. It ensures placements for all eligible participants so they can stride with confidence into any professional sphere.\u003c/p\u003e\r\n\r\n\u003cp\u003eKEF is now at the cusp of change as it prepares for the next chapter in its journey toward empowering the youth with quality education and livelihood. Armed with its vast experience and expertise, the organisation now aims to scale its depth as well as the breadth of its reach. KEF\u0026rsquo;s philosophy is evolving from \u0026lsquo;school as a unit\u0026rsquo; to working toward district/state-level education transformation. As KEF expands its ambit, it will help drive systemic reform and state education transformation to create long-term Impact at Scale.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cem\u003eKotak Education Foundation is the primary implementing agency for the CSR initiatives of Kotak Mahindra Group in Education. Kotak Karma is the Corporate Social Responsibility (CSR) identity of Kotak Mahindra Group Companies.\u003c/em\u003e\u003c/p\u003e","headline":null,"bannerImageUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarships/banners/document_1784010977.jpg","redirectLink":null,"programName":"Kotak Kanya Scholarship 2026-27","qnaCategoryId":5918,"qnaCategorySlug":"kotak-kanya-girls-scholarship-programme","tnc":null,"updatedAt":1784613118000,"videos":[],"audios":[],"scholarships":[{"scholarshipId":26763,"deadline":"2026-11-15","title":"Kotak Kanya Scholarship 2026-27","logoUrl":"https://dle9eg0t055l3.cloudfront.net/static/scholarship_logo/logo_26763_1784108729.png","bsid":"KKGS5","slug":"kotak-kanya-scholarship-2026-27","eligibility":"\u003cul\u003e\r\n\t\u003cli\u003eOpen for meritorious girl students across India.\u003c/li\u003e\r\n\t\u003cli\u003eApplicants must have scored at least 75% or more marks or equivalent CGPA in Class 12 board examinations.\u003c/li\u003e\r\n\t\u003cli\u003eApplicant\u0026#39;s annual family income must not exceed INR 6,00,000.\u003c/li\u003e\r\n\t\u003cli\u003eMeritorious girl students who have secured admission to the first year of graduation programs in the academic year 2026-27 in institutes of repute like NIRF/NAAC accredited for professional graduation degrees, such as Engineering, MBBS, Integrated LLB (5 Years), Integrated BS-MS/BS-Research, in ISER, IISC(Bangalore), or other professional courses (Design, Architecture, etc.).\u003c/li\u003e\r\n\t\u003cli\u003eChildren of employees of Kotak Mahindra Group, Kotak Education Foundation and Buddy4Stu
