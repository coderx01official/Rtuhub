ure affordable quality education for all","mission":"Mission","mission_desc":"To simplify scholarship accessibility for students and disbursement process for providers","values":"Values","values_desc":"Honesty | Integrity | Transparency","company_history":"Company History","company_march_2019_award":"Recognized for 'Creating Social Impact through Access to Education'- World CSR Congress: CSR Leadership Awards 2019","company_february_2019_award":"Best CSR Impact Award 2019- UBS Forums Corporate Social Responsibility Awards","company_june_2017_award":"Innovators Race Top 50 2017 finalists","company_march_1_2017_award":"Winner of Best CSR Project Award by IndiaCSR","company_march_2_2017_award":"Awards of Appreciation by IndiaCSR presented in National Summit on Best Practices in CSR","company_march_2016_award":"Incubated at IIM Calcutta through a rigorous selection out of 900 applicants","company_october_1_2015_award":"Chosen among top 50 Most Innovative IT Product Companies of 2015 as per NASSCOM Emerge 50 wards","company_october_2_2015_award":"Recognized by Indian Institute of Management, Rohtak at 2nd Internet Start-up Summit – October","company_february_2015_award":"Top 10 Social Enterprise of 2015 among India’s 100 leading Social Entrepreneurs as per Action for India Forum","company_december_2014_award":"Winner of South Asia \u0026 Asia Pacific Manthan Award in education category among 69 teams from 39 countries","company_february":"February","company_march":"March","company_june":"June","company_october":"October","company_december":"December","about_us_banner_title":"india's largest scholarship platform","about_us_banner_desc":"Connecting Scholarship Seekers with Scholarship Providers","about_us_breadcrum":"About Us","disclaimer_title":"Disclaimer","privacy_policy_title":"गोपनीयता नीति","update_mobile_section_title":"Update Mobile No.","my_favorites_title":"My Favorites","footer_menu_faqs":"FAQS","footer_menu_tnc":null},"url":"/page/legrand-empowering-scholarship-program","seoData":{"id":16066,"title":"Legrand Empowering Scholarship Program 2025-26 [Win up to INR 100,000 per year]","url":"page/legrand-empowering-scholarship-program","keyword":"Scholarship 2025, Scholarship for Girls, Engineering Scholarship, Legrand Scholarship, Architecture Scholarship, Transgender scholarship, PwD scholarship","description":"Legrand Empowering Scholarship Program 2025-26 supports meritorious girls, differently-abled girls, LGBTQ+ students, Covid-affected students pursuing B.Tech., B.E., B.Arch., B.B.A., B.Com., or B.Sc. degrees in India.","flgDeleted":0,"canonicalUrl":"page/legrand-empowering-scholarship-program"},"__N_SSP":true,"pageProps":{"scholarship":{"source":"brand-page","oppurtunityType":"Scholarship","qnaCategory":null,"brandPage":{"aboutUs":null,"logoUrl":"https://s3-ap-southeast-1.amazonaws.com/cdn.buddy4study.com/static/scholarship_logo/document_1601376324.jpg","brandPageId":2485,"address":{"address":"Mumbai","pincode":"201206","city":"mumbai","district":"Thane","state":"Maharashtra"},"slug":"legrand-empowering-scholarship-program","name":"Group Legrand India","aboutProgram":"\u003cp\u003eThe\u003cstrong\u003e Legrand Empowering Scholarship Program 2025-26\u003c/strong\u003e, a Social Initiative of Group Legrand India, aims to provide financial support to meritorious girls, differently-abled girls, Covid-affected students, LGBTQ+ students and students with single parents or those who are orphans, to help them pursue higher education. Under this program, academically promising girl students enrolled in B.Tech., B.E., B.Arch., or undergraduate degrees in Finance or Science (such as B.Sc, B.Com, B.B.A., etc.) will receive 60% of the annual course fee, up to \u003cstrong\u003eINR 60,000 per year\u003c/strong\u003e. \u003cstrong\u003eStudents in the special category* \u003c/strong\u003ewill receive 80% of the annual course fee, up to I\u003cstrong\u003eNR 1,00,000 per year\u003c/strong\u003e, until they complete their course, based on their academic performance.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e*Special category:\u003c/strong\u003e \u003cem\u003eDifferently-abled girl students, LGBTQ+ students, Covid-affected students, and students with single parents or orphans.\u003c/em\u003e\u003cbr /\u003e\r\n\u003cbr /\u003e\r\n\u003cstrong\u003eAbout Legrand\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eLegrand \u003c/strong\u003eis a global specialist in electrical and digital building infrastructure. Based in Limoges, Legrand operates in 90 countries with a market presence in over 180 countries. Legrand offers a wide range of products, including:\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eEnergy distribution\u003c/li\u003e\r\n\t\u003cli\u003eWiring devices\u003c/li\u003e\r\n\t\u003cli\u003eHome automation\u003c/li\u003e\r\n\t\u003cli\u003eStructured cabling\u003c/li\u003e\r\n\t\u003cli\u003eUPS\u003c/li\u003e\r\n\t\u003cli\u003eLighting management solutions\u003c/li\u003e\r\n\t\u003cli\u003eCable management\u003c/li\u003e\r\n\t\u003cli\u003eIndustrial application products\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003eLegrand, a global leader in electrical and digital building infrastructure, has been illuminating millions of Indian homes while empowering female students to pursue higher education and become future leaders in Engineering, Architecture, Finance and Science. As part of Group Legrand India\u0026rsquo;s commitment to promote diversity, equity, and inclusion, the scholarship support is also extended to differently-abled girl children and LGBTQ+ communities. Till date, over 500 students have benefited from this scholarship program.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKey Highlights\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eScholarship benefit is provided until the end of the course, subject to the student\u0026#39;s academic performance.\u003c/li\u003e\r\n\t\u003cli\u003eMentoring support is offered to selected scholarship recipients by Legrand India. Industrial experts and subject matter experts help nurture future women leaders.\u003c/li\u003e\r\n\t\u003cli\u003eA bi-annual Student Connect Program is organised for all the beneficiaries of this scholarship program to connect with the leaders from Group Legrand India and to build a network for development.\u003c/li\u003e\r\n\u003c/ul\u003e","headline":null,"bannerImageUrl":"https://d2w7l1p59qkl0r.cloudfront.net/static/scholarships/banners/document_1753166622.jpg","redirectLink":null,"programName":"Legrand Empowering Scholarship Program 2025-26","qnaCategoryId":120,"qnaCategorySlug":"legrand-scholarship","tnc":null,"updatedAt":1760336226000,"videos":[],"audios":[],"scholarships":[{"scholarshipId":25302,"deadline":"2025-12-05","title":"Legrand Empowering Scholarship Program 2025-26 (General Category Application)","logoUrl":"https://d2w7l1p59qkl0r.cloudfront.net/static/scholarship_logo/logo_25302_1753102503.jpg","bsid":"LFLS12","slug":"legrand-empowering-scholarship-program-2025-26-general-category-application","eligibility":"\u003cul\u003e\r\n\t\u003cli\u003eOpen for girl students across India only.\u003c/li\u003e\r\n\t\u003cli\u003eApplicants must have secured admission in B.Tech., B.E., B.Arch., B.B.A., B.Com., or B.Sc. degrees in India.\u003c/li\u003e\r\n\t\u003cli\u003eApplicants must have passed Class 12 in the year 2024\u0026ndash;25.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eApplicants must have secured a minimum of 70% and above marks in Class 10 and 12 examinations.\u003c/li\u003e\r\n\t\u003cli\u003eThe applicant\u0026#39;s annual family income from all sources must be less than or equal to INR 5,00,000.\u003c/li\u003e\r\n\u003c/ul\u003e","applicableFor":"Girls pursuing B.Tech./B.E./B.Arch./B.B.A./B.Com./ B.Sc. degrees","purposeAward":"60% of annual tuition fees up to INR 60,000 per year","contactNumber":null,"contactEmail":null,"views":245,"applyLink":"https://www.buddy4study.com/a
