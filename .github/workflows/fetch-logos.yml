# College logos ke candidates download karke isi branch par commit karta hai.
# Sirf "logo-fetch" branch par push se chalta hai; main ya site deploy par koi asar nahi.
name: Fetch college logos
on:
  push:
    branches: [logo-fetch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-logos.mjs
        env:
          JOBS: tools/logo-jobs4.json
          OUT: logos-raw4
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-raw4
          git commit -m "Logo candidates [skip ci]" || echo "nothing to commit"
          git push
