# College logos ke candidates download karke isi branch par commit karta hai.
# Sirf "logo-fetch" branch par push se chalta hai; main ya site deploy par koi asar nahi.
name: Fetch college logos
on:
  push:
    branches: [logo-fetch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p aicte-raw
          curl -sv -m 40 -o aicte-raw/dash.html "https://facilities.aicte-india.org/dashboard/pages/dashboardaicte.php" > aicte-raw/curl1.txt 2>&1 || true
          curl -sv -m 40 -o aicte-raw/home.html "https://www.aicte-india.org/" > aicte-raw/curl2.txt 2>&1 || true
          curl -sv -m 40 -o aicte-raw/fac.html "https://facilities.aicte-india.org/" > aicte-raw/curl3.txt 2>&1 || true
          tail -c 1500 aicte-raw/curl1.txt
        env:
          JOBS: tools/logo-jobs5.json
          OUT: logos-raw5
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aicte-raw
          git commit -m "Logo candidates [skip ci]" || echo "nothing to commit"
          git push
