# Har 2 ghante: RTU ke official exam portal (rtu.sumsraj.com) se news, notices aur last dates padhkar
# "news-data" branch par daalta hai. Site /api/news se wahi JSON padhti hai (deploy nahi hota).
# (Scholarship wala job "data" branch use karta hai; dono alag rehte hain.)
name: RTU news live check
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-live
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/news-live.mjs
        env:
          # rtu.ac.in ke naye notices Brave Search se (har 12 ghante). Secret na ho to ye hissa band rehta hai.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      - name: Publish to news-data branch
        run: |
          cd out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "Live RTU news $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" news-data
