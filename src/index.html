<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- %TITLE% jaisi cheezein build.mjs har page ke liye bharta hai -->
  <title>%TITLE%</title>
  <meta name="description" content="%DESC%">
  <link rel="canonical" href="%URL%">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="rtuhub.in">
  <meta property="og:title" content="%TITLE%">
  <meta property="og:description" content="%DESC%">
  <meta property="og:url" content="%URL%">
  <meta property="og:image" content="https://rtuhub.in/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://rtuhub.in/og-image.png">
  <meta name="theme-color" content="#060913">
%HEAD%
  <!-- Icons: asli files (Google search result mein icon inhi se aata hai) -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Purana user seedha apne year ke page par; purana #/sgpa link bhi chalta rahe -->
  <script>try{var h=localStorage.getItem('rtuhub_home');if(location.hash==='#/sgpa')location.replace('/sgpa-calculator');else if(location.pathname==='/'&&/^\/[1-4][a-z]{2}year(\/[a-z-]+)?$/.test(h))location.replace(h)}catch(e){}</script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- papers ka storage: pehle se connection khol do, paper jaldi khulega -->
  <link rel="preconnect" href="https://pub-b038a4e459b348ca866cf5ebc2e874ac.r2.dev" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="%CSS%">
  <script defer src="%JS%"></script>
</head>
