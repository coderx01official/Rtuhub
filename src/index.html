<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- %TITLE% jaisi cheezein build.mjs har page ke liye bharta hai -->
  <title>%TITLE%</title>
  <meta name="description" content="%DESC%">
  <link rel="canonical" href="%URL%">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="rtuhub.in">
  <meta property="og:title" content="%TITLE%">
  <meta property="og:description" content="%DESC%">
  <meta property="og:url" content="%URL%">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0b0c15">
%HEAD%
  <!-- Favicon - Engineering Logo -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0c15'/><circle cx='50' cy='40' r='20' stroke='%233f7eff' stroke-width='5' fill='none'/><path d='M50 40 L70 70' stroke='%23ffaa33' stroke-width='5'/><path d='M50 40 L30 70' stroke='%2366ccff' stroke-width='5'/><circle cx='50' cy='40' r='5' fill='%23ffd966'/><text x='50' y='85' font-size='12' text-anchor='middle' fill='%23ffffff' font-family='Arial' font-weight='bold'>RTU</text></svg>">
  <!-- Purana user seedha apne year ke page par; purana #/sgpa link bhi chalta rahe -->
  <script>try{var h=localStorage.getItem('rtuhub_home');if(location.hash==='#/sgpa')location.replace('/sgpa-calculator');else if(location.pathname==='/'&&/^\/[1-4][a-z]{2}year(\/[a-z-]+)?$/.test(h))location.replace(h)}catch(e){}</script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="%CSS%">
  <script defer src="%JS%"></script>
</head>
<body>
<div id="root">%APP%</div>
</body>
</html>
